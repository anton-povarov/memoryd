openapi: 3.0.3
info:
  title: memoryd API
  version: 0.1.0
  description: |
    HTTP contract for the currently implemented local Memory Vault slice. A
    Memory is one user-visible thing preserved by the Vault and is identified
    by the content of its Blob.
servers:
  - url: /api/v0
    description: Local memoryd server
tags:
  - name: health
  - name: memories
paths:
  /livez:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Check whether the process is alive
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Check whether the server can accept requests
      responses:
        "200":
          description: The server is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /memories:
    get:
      operationId: browseMemories
      tags: [memories]
      summary: Browse committed Memories
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of Memories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPage"
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/{memoryId}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get committed Memory details
      responses:
        "200":
          description: The Memory, its Import Context, and background understanding status and active Run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDetail"
        "404":
          description: The requested Memory does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete one Memory and its Blob
      description: |
        Permanently deletes the Memory, its Understanding Runs, and the
        immutable Blob referenced by it. The Vault reuses the Blob only when
        its content is imported again.
      responses:
        "204":
          description: The Memory and its Blob were deleted.
        "404":
          description: The requested Memory does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/{memoryId}/content:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getMemoryContent
      tags: [memories]
      summary: Download and verify a Memory's immutable Blob
      responses:
        "200":
          description: |
            The original imported bytes after their size and content digest
            have been verified against the committed Memory.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggested filename for download.
            ETag:
              schema:
                type: string
              description: The content hash, quoted as an HTTP entity tag.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: The requested Memory does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The committed Memory's Blob is missing or corrupt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "507":
          description: Insufficient storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/import:
    post:
      operationId: importMemory
      tags: [memories]
      summary: Durably import one Blob as a Memory
      description: |
        Upload one Blob and return after its bytes are durably published and
        the Memory is committed. A Blob may contain at most 100 MiB
        (104857600 bytes). The server permits bounded multipart protocol
        overhead in addition to that Blob limit. Duplicate content is rejected
        with HTTP 409. Document Understanding is not performed by this request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportMultipart"
      responses:
        "201":
          description: The committed Memory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySummary"
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The candidate is a Duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The Blob or bounded multipart request is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The import failed before the Memory committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: memory_not_found
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        existing_memory:
          allOf:
            - $ref: "#/components/schemas/DuplicateMemory"
          nullable: true
          description: Present on a duplicate import conflict so clients can recover.

    ImportMultipart:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          maxLength: 104857600
          description: |
            One Blob of at most 100 MiB with a nonblank filename in
            Content-Disposition. The server detects its Media Type from content
            first and may fall back to a valid, specific part Content-Type.
        import_context:
          $ref: "#/components/schemas/ImportContextInput"

    ImportContextInput:
      type: object
      description: |
        Optional client-observed provenance sent as one application/json
        multipart part. The original filename comes from the Blob part. Omitted
        values remain unknown; malformed timestamps reject the import.
      additionalProperties: false
      properties:
        relative_path:
          type: string
        full_path:
          type: string
        filesystem_created_at:
          type: string
          format: date-time
        filesystem_modified_at:
          type: string
          format: date-time

    DuplicateMemory:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    MemorySummary:
      type: object
      required:
        - id
        - blob_hash
        - media_type
        - byte_size
        - original_filename
        - imported_at
      properties:
        id:
          type: string
          format: uuid
        blob_hash:
          type: string
          pattern: "^sha256-[a-f0-9]{64}$"
          description: Canonical SHA-256 Blobref of the immutable Blob.
        media_type:
          type: string
        byte_size:
          type: integer
          format: int64
          minimum: 0
        original_filename:
          type: string
        imported_at:
          type: string
          format: date-time
        original_created_at:
          type: string
          format: date-time
          nullable: true
        original_modified_at:
          type: string
          format: date-time
          nullable: true

    MemoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemorySummary"
        next_cursor:
          type: string
          nullable: true

    MemoryDetail:
      type: object
      required: [memory, import_context, understanding]
      properties:
        memory:
          $ref: "#/components/schemas/MemorySummary"
        content_url:
          type: string
          description: Relative URL of the content download endpoint.
        import_context:
          $ref: "#/components/schemas/ImportContext"
        understanding:
          $ref: "#/components/schemas/UnderstandingDetails"

    UnderstandingDetails:
      type: object
      required: [status, latest_attempt, active_run]
      properties:
        status:
          type: string
          enum: [queued, running, done, failed]
        latest_attempt:
          allOf:
            - $ref: "#/components/schemas/UnderstandingAttempt"
          nullable: true
        active_run:
          allOf:
            - $ref: "#/components/schemas/UnderstandingRun"
          nullable: true
          description: The last complete successful Run; failed attempts do not replace it.

    UnderstandingAttempt:
      type: object
      required: [id, plugin_id, status, queued_at]
      properties:
        id:
          type: string
          format: uuid
        plugin_id:
          type: string
          description: Configured plugin ID; empty when no plugin is selected.
        status:
          type: string
          enum: [queued, running, done, failed]
        queued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        diagnostics:
          allOf:
            - $ref: "#/components/schemas/UnderstandingDiagnostics"
          nullable: true

    UnderstandingDiagnostics:
      type: object
      required: [error, stdout, stderr]
      properties:
        error:
          type: string
        stdout:
          type: string
          description: Captured plugin stdout, including invalid protocol output.
        stderr:
          type: string
          description: Captured plugin diagnostics; may contain private source content.
        exit_code:
          type: integer
          nullable: true

    UnderstandingRun:
      type: object
      required: [id, attempt_id, plugin_id, plugin_version, source_blobref, created_at, completed_at, warnings, artifacts]
      properties:
        id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        plugin_id:
          type: string
        plugin_version:
          type: string
        source_blobref:
          type: string
          pattern: "^sha256-[a-f0-9]{64}$"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        statistics:
          allOf:
            - $ref: "#/components/schemas/Statistics"
          description: Optional plugin-reported Run totals.
        cost_estimate:
          allOf:
            - $ref: "#/components/schemas/CostEstimate"
          description: Optional API-equivalent estimate, not subscription charges.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/DerivedContent"

    DerivedContent:
      type: object
      required: [id, blob_hash, byte_size, content_type, content]
      description: Independent text artifact belonging to its containing Run.
      properties:
        id:
          type: string
          format: uuid
        blob_hash:
          type: string
          pattern: "^sha256-[a-f0-9]{64}$"
        byte_size:
          type: integer
          format: int64
          minimum: 0
        content_type:
          type: string
        content:
          type: string
          description: Literal UTF-8 text content.
        provenance:
          description: Optional opaque plugin-defined JSON metadata.
        scope:
          description: Optional opaque plugin-defined JSON metadata.
    Statistics:
      type: object
      additionalProperties: false
      properties:
        usage:
          allOf:
            - $ref: "#/components/schemas/TokenUsage"

    TokenUsage:
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        cached_input_tokens:
          type: integer
          format: int64
          minimum: 0
        cache_write_input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        reasoning_output_tokens:
          type: integer
          format: int64
          minimum: 0
        total_tokens:
          type: integer
          format: int64
          minimum: 0

    CostEstimate:
      type: object
      required: [amount_usd, basis]
      additionalProperties: false
      properties:
        amount_usd:
          type: number
          format: double
          minimum: 0
        basis:
          type: string
          minLength: 1
        pricing_date:
          type: string
        pricing_url:
          type: string

    ImportContext:
      type: object
      required: [original_filename]
      description: Stored provenance from the first successful import.
      properties:
        original_filename:
          type: string
        relative_path:
          type: string
        full_path:
          type: string
        filesystem_created_at:
          type: string
          format: date-time
          nullable: true
        filesystem_modified_at:
          type: string
          format: date-time
          nullable: true
