# memoryd binds to loopback by default. Keep this file local: paths may
# identify personal content.
server:
  address: 127.0.0.1:8080
  shutdown_timeout: 10s

storage:
  data_dir: ./server/data
  # database_path: ./server/data/memoryd.sqlite
  # blob_dir: ./server/data/blobs
  # upload_dir: ./server/data/uploads

logging:
  level: info

understanding:
  max_concurrent: 1
  plugins: {}
  # Example plugin:
  # plugins:
  #   pdf:
  #     command: [/absolute/path/to/pdf-understand]
  #     media_types: [application/pdf]
